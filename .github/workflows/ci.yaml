name: '[CI] Automação de Testes na Camada de Serviço (API): Trabalho de conclusão'

on:
  # Disparo Manual
  workflow_dispatch:

  # Disparo por Push
  push:
    branches:
      - main

  # Disparo Agendado
  schedule:
    #cronograma de execução: a cada 6 minutos
    - cron: '*/6 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Intalando depêndencias
        run: npm ci

      - name: Criar arquivo .env
        run: |
          echo "API_URL=http://localhost:3000" >> .env
          echo "ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}" >> .env
          echo "ADMIN_SENHA=${{ secrets.ADMIN_SENHA }}" >> .env
          echo "ALUNO_EMAIL=${{ secrets.ALUNO_EMAIL }}" >> .env
          echo "ALUNO_SENHA=${{ secrets.ALUNO_SENHA }}" >> .env          

      - name: Iniciando a API
        run: |
          npm start > api.log 2>&1 &

      - name: Aguardar a API
        run: |
          echo "Aguardando a API iniciar..."

          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "API disponível!"
              exit 0
            fi

            echo "API ainda não está disponível. Tentativa $i/30..."
            sleep 2
          done

          echo "A API não iniciou."
          cat api.log
          exit 1 

      - name: Executando testes e gerando relatório
        run: npm run test:report
      
      - name: Verificar relatório
        run: |
          echo "Conteúdo do mochawesome-report:"
          ls -la ./mochawesome-report

      - name: Criar index.html para GitHub Pages
        run: cp ./mochawesome-report/mochawesome.html ./mochawesome-report/index.html

      - name: Configurando GitHub Pages
        if: always()
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./mochawesome-report

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4